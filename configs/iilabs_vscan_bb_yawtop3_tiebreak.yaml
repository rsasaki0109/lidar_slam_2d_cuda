slam:
  virtual_scan:
    z_min: -0.1
    z_max: 0.3
    angular_resolution_deg: 0.5
    max_range: 10.0
  preprocess:
    max_range: 10.0
    stride: 1
  local_matching:
    type: hybrid_bb
    branch_bound:
      resolution_m: 0.05
      n_levels: 4
      linear_window_m: 0.3
      angular_window_deg: 20.0
      angular_step_deg: 1.0
      sigma_hit_m: 0.10
    icp:
      max_iterations: 15
      max_correspondence_dist_m: 0.75
      min_correspondences: 50
      trim_fraction: 0.10
    hybrid_refinement:
      top_k: 3
      min_angular_dist_deg: 1.0
      # Narrow tiebreaker: when refined-candidate scores are essentially tied
      # and ICP RMS is not meaningfully worse, prefer the candidate whose
      # post-ICP yaw stays closest to the motion-prior prediction. Off in the
      # baseline yawtop3 config; opt-in here only.
      prediction_yaw_tiebreak_enabled: true
      tiebreak_score_eps: 0.002          # selection_score gap considered "tied"
      tiebreak_rms_eps: 0.005            # ICP RMS allowed to be at most this much worse
      tiebreak_yaw_margin_rad: 0.0087    # 0.5 deg minimum pred-yaw improvement to swap
  prediction:
    mode: constant_velocity
    gain: 1.0
  submap:
    max_submap_scans: 35
    downsample_stride: 1
  optimize_every_n_keyframes: 25
  loop_detection:
    enabled: false
  pose_graph:
    max_iterations: 45
    max_nfev_cap: 120000
